<!-- @dsCard height=288 -->
<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>璞域品牌策略</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .blk { rx:var(--r); }
  .navy { fill:var(--navy); }
  .ink { fill:var(--ink); }
  .brass { fill:var(--brass); }
  .gold { fill:var(--brass-light); }
  .rule-ink { fill:var(--ink); }
  .rule-brass { fill:var(--brass); }
  .rule-soft { fill:var(--rule-strong); }
  /* 列印主題的 navy 是白色，封面改用 ink-2 承接案例色塊 */
  [data-theme="print"] .navy { fill:var(--ink-2); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-serif); font-size:68px; line-height:.95; font-weight:600; letter-spacing:.02em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; letter-spacing:.04em; color:var(--ink-3); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      navy 224×208 bled off the top (the case slab, identity hue, largest) · ink 256×128 bled off top-right (the reversed panel) · brass 96×80 (the one accent) · brass-light 160×80 bled right (the gold that reads on navy) — ≈36% of 960×288
  arrangement flush modular grid with shared edges, like .svc-grid / .tiles; bottoms on one line at y=200, space-4 inset from the box edge
  pattern     hairlines, from "以細線分層，不用陰影": a 1px ink rule (the .sec-head top) with a 2px brass lead (the .principles top), then two 1px rule-strong rules beneath — four rules, crossing under the grid
  scales      sides in space-4 (16px) multiples; rules space-6 / space-4 apart; corners r (3px)
-->
<rect class="navy blk" x="16" y="-8" width="224" height="208" rx="3"/>
<rect class="ink blk" x="240" y="-8" width="256" height="128" rx="3"/>
<rect class="brass blk" x="240" y="120" width="96" height="80" rx="3"/>
<rect class="gold blk" x="336" y="120" width="160" height="80" rx="3"/>
<rect class="rule-ink" x="16" y="232" width="480" height="1"/>
<rect class="rule-brass" x="16" y="231" width="64" height="2"/>
<rect class="rule-soft" x="16" y="248" width="480" height="1"/>
<rect class="rule-soft" x="16" y="264" width="480" height="1"/>
</svg>
</div>
<div class="words">
<h1 class="name">璞域品牌策略</h1>
<p class="tag">從一張建照圖，到結案的整合企劃</p>
</div>
</div>
</body>
</html>
