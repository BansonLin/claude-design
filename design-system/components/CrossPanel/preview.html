<!doctype html>
<html lang="zh-Hant-TW">
<head><meta charset="utf-8"><title>CrossPanel — preview</title></head>
<body>
<div class="ds-frame">
<div class="cross" style="margin-top:0"><h3>橫向機制：每個階段都在用</h3><ul><li><h4>單一事實來源</h4><p>每案一份案件事實檔，每條事實標明等級：A 建照／B 業主確認／C 估算提案／X <span class="nw">外部查證。</span></p></li><li><h4>決策紀錄</h4><p>每道關卡的決定都寫入紀錄並註明日期與決策者，定案會<span class="nw">覆蓋提案。</span></p></li><li><h4>交付前品質關卡</h4><p>自動檢查禁用詞、過時用語、事實衝突寫法、PDF 中文字型與對外檔案的<span class="nw">機密連結。</span></p></li><li><h4>機密三級</h4><p>內部、業主、對外三級分開存放，對外檔案不得連結<span class="nw">內部資料。</span></p></li><li><h4>環境健檢</h4><p>開工前檢查中文字型、網路白名單與套件，避免 PDF 印成方框或資料<span class="nw">下載中斷。</span></p></li></ul></div>
</div>
</body>
</html>
