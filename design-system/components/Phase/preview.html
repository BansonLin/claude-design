<article class="phase" style="border-top:0;padding-top:0"><div class="ph-id"><span class="ph-code">P0</span><h3 class="ph-name">啟案定錨</h3><p class="ph-hours"><span>預估工時</span><span><span class="nw">8–12 小時</span></span></p></div><div class="ph-body"><p class="ph-purpose">動手之前，先把案名由來、角色分工、已定與未定事項、預算時程與資料公開範圍寫成書面紀錄，並建立案<span class="nw">件事實檔。</span></p><div class="ph-cols"><div><h4>業主需提供</h4><ul><li>建照圖與基本資料</li><li>營造、代銷、建築師、設計的角色與窗口</li><li>已定與未定事項</li></ul></div><div><h4>交付物</h4><ul><li>啟案問卷</li><li>關係人與競合地圖</li><li>案件事實檔</li></ul></div><div class="gate"><h4>決策關卡</h4><p class="gt-title"><span class="gt-code">G0</span><span>業主書面確認關鍵前提</span></p><p class="gt-body">案名由來與含義、各角色分工、已定與未定事項、預算與時程、哪些資<span class="nw">料可對外。</span></p></div></div></div></article>
